# Runs on every push and PR to master:
#   1. Build (Release, multi-target)
#   2. Run unit tests with coverage
#   3. Dry-run dotnet pack to verify the package can be built
#   4. Upload test results and coverage as artifacts

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for source-link

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      # xunit.v3 test projects are self-executing Microsoft.Testing.Platform hosts.
      # `dotnet test` cannot drive them on the .NET 10 SDK: its "--server dotnettestcli"
      # handshake is incompatible with the MTP version xunit.v3 ships, and the run
      # reports "Zero tests ran". Invoking each framework's binary directly is the
      # supported MTP path and reports TRX + Cobertura natively.
      - name: Test
        run: |
          for suite in TerraPDF.Tests TerraPDF.Agents.Tests; do
            for tfm in net8.0 net9.0 net10.0; do
              echo "::group::$suite $tfm"
              ./tests/$suite/bin/Release/$tfm/$suite \
                --report-trx --report-trx-filename "test-results-$suite-$tfm.trx" \
                --coverage --coverage-output "coverage-$suite-$tfm.cobertura.xml" \
                --results-directory TestResults
              echo "::endgroup::"
            done
          done

      # Verify that the library packs cleanly on every CI run.
      # This catches missing files, bad metadata, or SourceLink errors early,
      # well before a release is attempted.
      - name: Pack (dry run)
        run: |
          for project in TerraPDF TerraPDF.Agents TerraPDF.Mcp; do
            dotnet pack src/$project/$project.csproj \
              --no-build \
              -c Release \
              -o ./artifacts
          done

      - name: Upload package (dry-run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nuget-ci-package
          path: ./artifacts/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "TestResults/**/*.cobertura.xml"
