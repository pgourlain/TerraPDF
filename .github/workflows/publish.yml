# Publishes the TerraPDF NuGet package to nuget.org.
#
# Triggered automatically when a GitHub Release is published.
# The release tag MUST follow semantic versioning with a "v" prefix (e.g. v1.2.0)
# and MUST match the <Version> in src/TerraPDF/TerraPDF.csproj.
#
# Required GitHub repository secret:
#   NUGET_API_KEY  - your nuget.org API key
#                    (Settings -> Secrets and variables -> Actions -> New repository secret)
#
# How to release (full checklist):
#   1. Bump <Version> in src/TerraPDF/TerraPDF.csproj        (e.g. 1.2.0)
#   2. Update CHANGELOG.md - move [Unreleased] items to [1.2.0] section
#   3. Commit everything and push to master
#   4. On GitHub: Releases -> Draft a new release
#      - Set tag to match the version, e.g.  v1.2.0
#      - Copy the CHANGELOG section as release notes
#      - Click "Publish release"
#   => This workflow runs automatically and pushes .nupkg + .snupkg to nuget.org
#
# Packages published by this workflow (each keeps its own <Version>):
#   TerraPDF         src/TerraPDF/TerraPDF.csproj              - the release tag must match this version
#   TerraPDF.Agents  src/TerraPDF.Agents/TerraPDF.Agents.csproj - agent tools (AIFunctions)
#   TerraPDF.Mcp     src/TerraPDF.Mcp/TerraPDF.Mcp.csproj       - MCP server (dotnet tool)
# Every release packs all three. A package whose version was not bumped is
# already on nuget.org and is skipped by --skip-duplicate, so bump TerraPDF.Agents
# or TerraPDF.Mcp only when they change. NUGET_API_KEY must be allowed to push
# all three package IDs (for example, glob pattern "TerraPDF*").

name: Publish NuGet

on:
  release:
    types: [ published ]

jobs:
  publish:
    name: Pack & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history required for source-link

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      # See ci.yml: xunit.v3 projects are self-executing Microsoft.Testing.Platform
      # hosts and `dotnet test` cannot drive them on the .NET 10 SDK, so the test
      # binaries are run directly. This gates the NuGet push, so it must fail loudly.
      - name: Test
        run: |
          for suite in TerraPDF.Tests TerraPDF.Agents.Tests; do
            for tfm in net8.0 net9.0 net10.0; do
              ./tests/$suite/bin/Release/$tfm/$suite
            done
          done

      # Ensure the Git tag (e.g. v1.2.0) matches <Version> in the .csproj (e.g. 1.2.0).
      # Prevents accidentally publishing the wrong version.
      - name: Verify tag matches csproj version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/TerraPDF/TerraPDF.csproj | tr -d '[:space:]')
          echo "Git tag version : $TAG_VERSION"
          echo "csproj version  : $CSPROJ_VERSION"
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match <Version> in TerraPDF.csproj ($CSPROJ_VERSION). Update the csproj before releasing."
            exit 1
          fi

      # The NuGet MCP server listing reads .mcp/server.json from the package; its
      # two version fields must match the TerraPDF.Mcp package version.
      - name: Verify MCP server.json matches TerraPDF.Mcp version
        shell: bash
        run: |
          MCP_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/TerraPDF.Mcp/TerraPDF.Mcp.csproj | tr -d '[:space:]')
          JSON_VERSIONS=$(grep -oP '"version":\s*"\K[^"]+' src/TerraPDF.Mcp/.mcp/server.json || true)
          echo "TerraPDF.Mcp version : $MCP_VERSION"
          echo "server.json versions : $(echo $JSON_VERSIONS)"
          # Fail closed: an unreadable version must not pass as "no mismatch".
          if [ -z "$MCP_VERSION" ] || [ -z "$JSON_VERSIONS" ]; then
            echo "::error::Could not read the TerraPDF.Mcp version from the csproj or .mcp/server.json."
            exit 1
          fi
          MISMATCHED=$(echo "$JSON_VERSIONS" | grep -vxF "$MCP_VERSION" || true)
          if [ -n "$MISMATCHED" ]; then
            echo "::error::src/TerraPDF.Mcp/.mcp/server.json has version(s) $MISMATCHED; expected $MCP_VERSION to match TerraPDF.Mcp.csproj."
            exit 1
          fi

      - name: Pack
        run: |
          for project in TerraPDF TerraPDF.Agents TerraPDF.Mcp; do
            dotnet pack src/$project/$project.csproj \
              --no-build \
              -c Release \
              -o ./artifacts
          done

      # Make the .nupkg and .snupkg downloadable from the Actions run page
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.ref_name }}
          path: ./artifacts/

      # --skip-duplicate turns an unchanged TerraPDF.Agents / TerraPDF.Mcp version
      # into a no-op instead of a failed release.
      - name: Push .nupkg to nuget.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push .snupkg symbols to nuget.org
        run: |
          dotnet nuget push ./artifacts/*.snupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
